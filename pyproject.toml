[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buildwise-agentic"
version = "0.9.0"
description = "Agentic AI support system for BuildWise Realty & Construction Group"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "PyJWT>=2.8",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
]
# Real model providers. The system runs fully without these using the
# deterministic offline provider (LLM_PROVIDER=mock).
llm = [
    "anthropic>=0.31",
    "openai>=1.35",
]
# Optional local cross-encoder reranker. Falls back to fusion order when absent.
rerank = [
    "sentence-transformers>=3.0",
]
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25",
]

[tool.setuptools]
packages = [
    "api", "api.routes", "api.schemas", "core", "agents", "orchestration",
    "retrieval", "connectors", "connectors.mock_server", "governance", "llm",
    "db", "db.seed", "eval",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "T20"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"db/seed/*" = ["T20"]
"eval/*" = ["T20"]
"retrieval/ingest.py" = ["T20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: requires postgres + redis",
    "security: adversarial access-control and injection tests",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
