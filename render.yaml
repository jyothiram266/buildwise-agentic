# One-click hosting on Render.
#
# ONE web service plus a managed Postgres. The API serves the compiled frontend on
# the same origin, and the mock systems of record run on loopback inside the same
# container (see scripts/start_prod.sh).
#
# Why one service rather than two: a second service means a cross-service URL, and
# Render's `fromService: property: hostport` yields "host:port" with no scheme — which
# produces a malformed connector URL that fails at the first request rather than at
# deploy time. Collapsing to one container removes that failure mode entirely, and the
# connectors still speak HTTP over loopback so the boundary is real. docker-compose
# still runs them separately for development.
#
# The free Postgres tier has no pgvector. That is handled: the app detects the
# extension at boot and falls back to scoring cosine similarity in Python over
# ACL-filtered rows. Same answers, slower ranking, access control unaffected.
# GET /health reports which mode is active.

databases:
  - name: buildwise-db
    databaseName: buildwise
    user: buildwise
    plan: free

services:
  - type: web
    name: buildwise
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # BUILD_WEB=true compiles the React bundle into the image. Without it the API
    # starts fine but serves no UI — locally the Vite dev server fills that role, and
    # there is no dev server here.
    dockerBuildArgs:
      BUILD_WEB: "true"
      INSTALL_DEV: "false"
    # Binds $PORT, starts the connectors on loopback, and bootstraps the database on
    # first boot. Free instances have no shell, so the seeding cannot be a manual step.
    dockerCommand: bash scripts/start_prod.sh
    plan: free
    healthCheckPath: /health
    envVars:
      # APP_ENV=dev deliberately, and this is the one setting to think about before
      # sharing the URL. In prod mode the X-Actor-Id header and the demo token endpoint
      # are both refused — which is correct for a real deployment, and would break the
      # role switcher that is the entire demo. Anyone with this URL can therefore act
      # as any persona. That is acceptable because every record is synthetic seed data.
      # Put real data behind real authentication first.
      - key: APP_ENV
        value: dev
      - key: DATABASE_URL
        fromDatabase:
          name: buildwise-db
          property: connectionString
      # Empty disables connector caching. Redis is an optimisation here; losing it
      # costs latency and says so in the logs rather than failing.
      - key: REDIS_URL
        value: ""
      # The deterministic offline provider: no API key needed, nothing leaves the box.
      # Set to anthropic and supply the key below for natural language.
      - key: LLM_PROVIDER
        value: mock
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: local
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
