server {
    listen 80;
    server_name _;

    # Enable HTTP Basic Authentication for public EC2 access
    auth_basic "BuildWise OS — Restricted System";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Client body size for document uploads
    client_max_body_size 20M;

    # Proxy API requests to backend FastAPI container
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API health check endpoint
    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # Proxy OpenAPI docs
    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Proxy Web UI requests to Vite/React container
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
